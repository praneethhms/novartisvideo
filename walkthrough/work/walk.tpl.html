<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Portrait app walkthrough (1080x1920). make_walk.py fills STEPS from timeline.json into walk.html. -->
<style>
  :root { --navy: #0B294C; --navy2: #0F3664; --ink: #06172C; --text: #FFFFFF; --soft: #C9D6E8; --accent: #6CC4FF; --track: rgba(255,255,255,0.16); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, Arial, "Liberation Sans", sans-serif; color: var(--text);
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); }
  .abs { position: absolute; }
  #brand { left: 60px; top: 62px; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 18px; }
  #brand img { height: 46px; display: block; }
  #brand span { font-weight: 400; color: var(--soft); font-size: 26px; padding: 6px 16px; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 30px; }
  #step { left: 60px; top: 150px; font-size: 28px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
  #title { left: 60px; top: 192px; width: 960px; font-size: 64px; font-weight: 800; letter-spacing: -1px; }
  #cap { left: 60px; top: 290px; width: 960px; font-size: 38px; line-height: 1.32; color: var(--soft); }
  #phone { left: 220px; top: 470px; width: 640px; height: 1388px; border-radius: 52px; overflow: hidden;
    box-shadow: 0 0 0 10px var(--ink), 0 0 0 12px rgba(255,255,255,0.18), 0 40px 90px rgba(0,0,0,0.45); background: #fff; }
  #phone img { width: 100%; height: 100%; display: block; }
  #prog { left: 60px; top: 1878px; width: 960px; height: 8px; display: flex; gap: 10px; }
  #prog div { flex: 1; background: var(--track); border-radius: 4px; overflow: hidden; }
  #prog i { display: block; height: 100%; width: 0; background: var(--accent); }
  #outro { inset: 0; background: linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%); opacity: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #outro .k { background: #fff; border-radius: 32px; padding: 64px 70px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); }
  #outro .k img { width: 760px; display: block; }
  #outro .d { font-size: 58px; color: var(--accent); margin-top: 70px; font-weight: 700; }
  #outro .s { font-size: 32px; color: var(--soft); margin-top: 60px; }
</style>
</head>
<body>
<div class="abs" id="brand"><img src="logo-white.png" alt="SafetyConnect"><span>App walkthrough</span></div>
<div class="abs" id="step"></div>
<div class="abs" id="title"></div>
<div class="abs" id="cap"></div>
<div class="abs" id="phone"><img id="scr" src="phone/p0000.jpg"></div>
<div class="abs" id="prog"></div>
<div class="abs" id="outro"><div class="k"><img src="logo-color.png" alt="SafetyConnect"></div><div class="d">Every journey matters.</div><div class="s">AI-powered driving safety on your phone</div></div>
<script>
const STEPS = __STEPS__;
const FPS = 30;
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - x, 3);
const prog = (t, t0, d) => cl((t - t0) / d);
const CHAPTERS = STEPS.filter(s => s.id !== 'intro' && s.id !== 'outro');
CHAPTERS.forEach(() => $('prog').insertAdjacentHTML('beforeend', '<div><i></i></div>'));
window.DURATION = STEPS[STEPS.length - 1].end;

function show(el, t, t0, t1, dy = 18) {
  // fades in at t0, out over the last 0.25s before t1
  const p = ease(prog(t, t0, 0.35)) * (1 - prog(t, t1 - 0.25, 0.25));
  el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`;
}

window.render = async function (t) {
  const s = STEPS.find(x => t >= x.start && t < x.end) || STEPS[STEPS.length - 1];
  const ci = CHAPTERS.indexOf(s);
  $('step').textContent = s.id === 'intro' ? 'ONE-MINUTE TOUR' : s.id === 'outro' ? '' : `${String(ci + 1).padStart(2, '0')} / ${String(CHAPTERS.length).padStart(2, '0')}`;
  $('title').textContent = s.id === 'intro' ? 'Meet the SafetyConnect app' : s.title;
  $('cap').textContent = s.caption;
  show($('step'), t, s.start + 0.02, s.end);
  show($('title'), t, s.start + 0.05, s.end);
  show($('cap'), t, s.vo_start - 0.05, s.end, 12);
  // progress: finished chapters full, current chapter fills over its duration
  [...$('prog').children].forEach((d, i) => {
    const c = CHAPTERS[i];
    d.firstChild.style.width = (100 * cl((t - c.start) / (c.end - c.start))) + '%';
  });
  $('prog').style.opacity = 1 - prog(t, STEPS[STEPS.length - 1].start, 0.4);
  // phone: gentle settle-in at the start, then follows the recording frame by frame
  const pin = ease(prog(t, 0, 0.6));
  $('phone').style.opacity = pin;
  $('phone').style.transform = `translateY(${(1 - pin) * 60}px)`;
  const o = ease(prog(t, STEPS[STEPS.length - 1].start + 0.05, 0.5));
  $('outro').style.opacity = o;
  $('outro').firstChild.style.transform = `translateY(${(1 - o) * 30}px)`;
  const img = $('scr');
  const src = `phone/p${String(Math.min(Math.round(t * FPS), 1799)).padStart(4, '0')}.jpg`;
  if (!img.src.endsWith(src)) { img.src = src; await img.decode(); }
};
</script>
</body>
</html>
